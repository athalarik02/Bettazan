<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%" fill="none">
  <rect width="800" height="533" fill="#EEF3EE" />
  <circle cx="400" cy="270" r="210" fill="#E2EBE2" />
  <ellipse cx="400" cy="450" rx="180" ry="20" fill="#C5D3C5" />

  <g id="kompor-portable">
    <!-- Tripod Legs Base -->
    <path d="M310 430 L360 370 L440 370 L490 430" stroke="#7A877E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="310" cy="430" r="10" fill="#D8A441" />
    <circle cx="490" cy="430" r="10" fill="#D8A441" />

    <!-- Gas Hose Connection to Canister on right -->
    <path d="M420 370 C480 370, 520 400, 560 410" stroke="#D8A441" stroke-width="6" fill="none" />
    <!-- Small Gas Canister -->
    <rect x="560" y="360" width="80" height="85" rx="12" fill="#E67E22" />
    <rect x="585" y="348" width="30" height="14" rx="4" fill="#B9770E" />

    <!-- Center Burner Assembly Base -->
    <rect x="365" y="320" width="70" height="55" rx="8" fill="#4B5650" />
    <rect x="380" y="375" width="40" height="16" rx="4" fill="#D8A441" />
    
    <!-- Red Piezo Igniter Button -->
    <rect x="340" y="340" width="16" height="24" rx="4" fill="#B42318" />
    <line x1="348" y1="340" x2="380" y2="310" stroke="#E2E8E0" stroke-width="2" />

    <!-- Folding Lotus Windproof Petals / Shield (Stainless Steel) -->
    <!-- Left petals -->
    <path d="M320 250 C320 320, 370 330, 380 330 Z" fill="#95A5A6" stroke="#7F8C8D" stroke-width="2" />
    <path d="M340 230 C340 310, 385 330, 390 330 Z" fill="#BDC3C7" stroke="#95A5A6" stroke-width="2" />
    <!-- Right petals -->
    <path d="M480 250 C480 320, 430 330, 420 330 Z" fill="#95A5A6" stroke="#7F8C8D" stroke-width="2" />
    <path d="M460 230 C460 310, 415 330, 410 330 Z" fill="#BDC3C7" stroke="#95A5A6" stroke-width="2" />

    <!-- Burner Mesh Top -->
    <ellipse cx="400" cy="305" rx="35" ry="14" fill="#2C3E50" stroke="#BDC3C7" stroke-width="3" />
    
    <!-- Clean Blue Flame Core -->
    <path d="M385 300 Q400 230 405 230 Q415 270 415 300 Z" fill="#3498DB" opacity="0.9" />
    <path d="M392 300 Q400 255 403 255 Q408 280 408 300 Z" fill="#F1C40F" />
  </g>
</svg>
