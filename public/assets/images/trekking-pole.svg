<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%" fill="none">
  <rect width="800" height="533" fill="#EEF3EE" />
  <circle cx="400" cy="270" r="210" fill="#E2EBE2" />
  <ellipse cx="400" cy="445" rx="230" ry="20" fill="#C5D3C5" />

  <g id="trekking-pole">
    <!-- First Pole (Slanted diagonal Left to Right) -->
    <g transform="rotate(-30 400 270)">
      <!-- Cork / EVA Grip Handle -->
      <rect x="388" y="100" width="24" height="110" rx="8" fill="#C49A58" stroke="#9E763B" stroke-width="2" />
      <!-- Finger contour grooves -->
      <line x1="388" y1="125" x2="412" y2="125" stroke="#9E763B" stroke-width="2" />
      <line x1="388" y1="150" x2="412" y2="150" stroke="#9E763B" stroke-width="2" />
      <line x1="388" y1="175" x2="412" y2="175" stroke="#9E763B" stroke-width="2" />
      <!-- Wrist Strap -->
      <path d="M400 110 C350 110, 340 180, 395 190" stroke="#214D36" stroke-width="6" fill="none" stroke-linecap="round" />

      <!-- Top Shaft (Duralumin 7075 Anodized Green) -->
      <rect x="393" y="210" width="14" height="100" fill="#214D36" />
      <!-- Flip Lock Mechanism 1 -->
      <rect x="389" y="305" width="22" height="16" rx="3" fill="#D8A441" />
      <rect x="408" y="307" width="8" height="12" rx="2" fill="#17251B" />

      <!-- Middle Shaft (Champagne / Silver Alloy) -->
      <rect x="394" y="320" width="12" height="100" fill="#B0BEC5" />
      <!-- Flip Lock Mechanism 2 -->
      <rect x="390" y="415" width="20" height="16" rx="3" fill="#D8A441" />

      <!-- Lower Shaft (Graphite) -->
      <rect x="395" y="430" width="10" height="80" fill="#37474F" />

      <!-- Mud Basket -->
      <polygon points="380,485 420,485 410,495 390,495" fill="#17251B" />
      <!-- Tungsten Carbide Tip -->
      <polygon points="398,510 402,510 400,525" fill="#D8A441" />
    </g>

    <!-- Second Pole (Slight offset parallel or cross) -->
    <g transform="rotate(-20 440 270)">
      <!-- Cork Grip -->
      <rect x="428" y="110" width="24" height="110" rx="8" fill="#C49A58" stroke="#9E763B" stroke-width="2" />
      <!-- Wrist Strap -->
      <path d="M440 120 C490 120, 500 190, 445 200" stroke="#214D36" stroke-width="6" fill="none" stroke-linecap="round" />
      <!-- Shaft -->
      <rect x="433" y="220" width="14" height="100" fill="#214D36" />
      <rect x="429" y="315" width="22" height="16" rx="3" fill="#D8A441" />
      <rect x="434" y="330" width="12" height="100" fill="#B0BEC5" />
      <rect x="430" y="425" width="20" height="16" rx="3" fill="#D8A441" />
      <rect x="435" y="440" width="10" height="80" fill="#37474F" />
      <polygon points="420,495 460,495 450,505 430,505" fill="#17251B" />
      <polygon points="438,520 442,520 440,535" fill="#D8A441" />
    </g>

    <!-- Pair Badge -->
    <rect x="520" y="375" width="95" height="26" rx="6" fill="#D8A441" />
    <text x="567" y="393" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#17251B" text-anchor="middle">SEPANG (2 PCS)</text>
  </g>
</svg>
