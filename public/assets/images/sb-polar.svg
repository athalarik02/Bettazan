<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%" fill="none">
  <rect width="800" height="533" fill="#EEF3EE" />
  <circle cx="400" cy="270" r="210" fill="#E2EBE2" />
  <ellipse cx="400" cy="445" rx="240" ry="22" fill="#C5D3C5" />

  <g id="sleeping-bag">
    <!-- Mummy Contour Body -->
    <path d="M190 280 C190 200, 240 170, 310 170 L590 210 C650 220, 680 250, 680 300 C680 345, 640 375, 580 380 L310 395 C240 395, 190 355, 190 280 Z" fill="#214D36" />
    
    <!-- Quilted Baffles Stitching lines -->
    <path d="M280 175 C310 270, 310 310, 280 392" stroke="#163826" stroke-width="4" fill="none" />
    <path d="M360 183 C390 270, 390 310, 360 390" stroke="#163826" stroke-width="4" fill="none" />
    <path d="M440 192 C470 270, 470 310, 440 387" stroke="#163826" stroke-width="4" fill="none" />
    <path d="M520 201 C550 270, 550 310, 520 383" stroke="#163826" stroke-width="4" fill="none" />
    <path d="M600 212 C625 270, 625 310, 600 380" stroke="#163826" stroke-width="4" fill="none" />

    <!-- Hood and Inner Polar Lining (Warm Charcoal / Cream Fur lining) -->
    <path d="M200 280 C200 225, 230 205, 275 205 C310 205, 330 235, 330 280 C330 325, 310 355, 275 355 C230 355, 200 335, 200 280 Z" fill="#3A3836" />
    <ellipse cx="265" cy="280" rx="45" ry="55" fill="#1C1B1A" />
    <!-- Fur rim -->
    <ellipse cx="265" cy="280" rx="45" ry="55" stroke="#D8A441" stroke-width="4" stroke-dasharray="6 4" fill="none" />

    <!-- Drawcord toggle -->
    <circle cx="320" cy="250" r="5" fill="#D8A441" />
    <line x1="320" y1="255" x2="335" y2="280" stroke="#E2E8E0" stroke-width="2.5" />

    <!-- Long Side Zipper -->
    <path d="M310 210 L640 235" stroke="#D8A441" stroke-width="3.5" stroke-dasharray="7 4" />

    <!-- Temp Rating Tag -->
    <rect x="520" y="320" width="80" height="24" rx="6" fill="#D8A441" />
    <text x="560" y="336" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#17251B" text-anchor="middle">10°C POLAR</text>
  </g>
</svg>
