<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%" fill="none">
  <rect width="800" height="533" fill="#EEF3EE" />
  <circle cx="400" cy="270" r="210" fill="#E2EBE2" />
  <ellipse cx="400" cy="440" rx="250" ry="22" fill="#C5D3C5" />

  <g id="matras-angin">
    <!-- Air Pad Base Outline (Ultralight Blue-Green 40D TPU) -->
    <rect x="160" y="220" width="480" height="150" rx="40" fill="#256B5D" />
    <rect x="160" y="235" width="480" height="135" rx="35" fill="#2E8573" />

    <!-- Built-in Ergonomic Pillow Section (Left Side) -->
    <rect x="175" y="210" width="120" height="160" rx="30" fill="#3AA38E" />
    <ellipse cx="235" cy="290" rx="40" ry="50" fill="#256B5D" opacity="0.3" />

    <!-- Diamond / Hex Baffled Air Cells -->
    <g fill="#256B5D" opacity="0.45">
      <!-- Column 1 -->
      <circle cx="330" cy="260" r="18" />
      <circle cx="330" cy="310" r="18" />
      <!-- Column 2 -->
      <circle cx="380" cy="245" r="18" />
      <circle cx="380" cy="285" r="18" />
      <circle cx="380" cy="325" r="18" />
      <!-- Column 3 -->
      <circle cx="430" cy="260" r="18" />
      <circle cx="430" cy="310" r="18" />
      <!-- Column 4 -->
      <circle cx="480" cy="245" r="18" />
      <circle cx="480" cy="285" r="18" />
      <circle cx="480" cy="325" r="18" />
      <!-- Column 5 -->
      <circle cx="530" cy="260" r="18" />
      <circle cx="530" cy="310" r="18" />
      <!-- Column 6 -->
      <circle cx="580" cy="285" r="18" />
    </g>

    <!-- Rapid Dual Inflation Valve -->
    <circle cx="600" cy="240" r="16" fill="#D8A441" stroke="#17251B" stroke-width="3" />
    <circle cx="600" cy="240" r="8" fill="#17251B" />

    <!-- 5cm Thickness Tag -->
    <rect x="490" y="375" width="95" height="25" rx="6" fill="#D8A441" />
    <text x="537" y="392" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#17251B" text-anchor="middle">TEBAL 5 CM</text>
  </g>
</svg>
