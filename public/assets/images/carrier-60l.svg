<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%" fill="none">
  <rect width="800" height="533" fill="#EEF3EE" />
  <circle cx="400" cy="270" r="210" fill="#E2EBE2" />
  <ellipse cx="400" cy="460" rx="140" ry="20" fill="#C5D3C5" />

  <g id="carrier-60l">
    <!-- Main Backpack Body -->
    <rect x="310" y="110" width="180" height="340" rx="30" fill="#214D36" />
    <!-- Top Lid / Brain -->
    <path d="M295 140 C295 95, 505 95, 505 140 Z" fill="#2E6B4B" />
    <path d="M305 135 L495 135" stroke="#D8A441" stroke-width="4" />
    <rect x="375" y="105" width="50" height="18" rx="4" fill="#D8A441" />
    <text x="400" y="118" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#17251B" text-anchor="middle">60 LITER</text>

    <!-- Front Stretch Mesh Pocket -->
    <path d="M330 200 Q400 215 470 200 L460 350 Q400 375 340 350 Z" fill="#183B29" stroke="#3A634E" stroke-width="2" />
    <!-- Bungee Compression Straps -->
    <path d="M340 230 L460 270 L340 310 L460 340" stroke="#D8A441" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Sleeping Pad Straps at Bottom -->
    <rect x="330" y="420" width="140" height="32" rx="16" fill="#4B5E50" stroke="#D8A441" stroke-width="3" />
    <line x1="365" y1="410" x2="365" y2="455" stroke="#17251B" stroke-width="4" />
    <line x1="435" y1="410" x2="435" y2="455" stroke="#17251B" stroke-width="4" />

    <!-- Side Pockets with Water Bottle -->
    <rect x="290" y="270" width="30" height="110" rx="8" fill="#183B29" />
    <rect x="480" y="270" width="30" height="110" rx="8" fill="#183B29" />
    <!-- Nalgene water bottle in side pocket -->
    <rect x="485" y="225" width="20" height="60" rx="6" fill="#5DADE2" />
    <rect x="488" y="215" width="14" height="10" rx="2" fill="#2E86C1" />

    <!-- Hip Belt Fins -->
    <path d="M310 390 Q220 405 230 435 Q300 440 320 420 Z" fill="#183B29" />
    <path d="M490 390 Q580 405 570 435 Q500 440 480 420 Z" fill="#183B29" />
    <rect x="370" y="405" width="60" height="14" rx="4" fill="#D8A441" />
  </g>
</svg>
